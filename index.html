<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Moves</title>
<meta name="description" content="A weekly morning and evening movement routine built from your saved reels.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Moves">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one phone-width column; sticky day header, step list as a numbered sequence, bottom tab bar. Morning = turmeric, evening = dusk indigo. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --fg:#18211F; --muted:#5A6863; --line:#DCE3DF;
  --am:#9A6400; --am-soft:#FBEFD3; --am-strong:#E0A019;
  --pm:#4347A0; --pm-soft:#E6E7F8; --pm-strong:#5B60C9;
  --ok:#2E7D4F; --ok-soft:#DDF1E4; --warn:#9B4A12; --warn-soft:#FBE7D8;
  --accent:var(--am); --accent-soft:var(--am-soft); --accent-strong:var(--am-strong);
  --display:"Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", -apple-system, system-ui, "Segoe UI", sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101615; --surface:#18201E; --fg:#E8EEEB; --muted:#9AA8A3; --line:#2A3532;
    --am:#F0B43A; --am-soft:#3A2D10; --am-strong:#F0B43A;
    --pm:#A9ADFF; --pm-soft:#25274A; --pm-strong:#8E93F5;
    --ok:#6FD39A; --ok-soft:#17352A; --warn:#F2A46D; --warn-soft:#3B2414;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#18201E; --fg:#E8EEEB; --muted:#9AA8A3; --line:#2A3532;
  --am:#F0B43A; --am-soft:#3A2D10; --am-strong:#F0B43A;
  --pm:#A9ADFF; --pm-soft:#25274A; --pm-strong:#8E93F5;
  --ok:#6FD39A; --ok-soft:#17352A; --warn:#F2A46D; --warn-soft:#3B2414;
  color-scheme:dark;
}
body.evening{ --accent:var(--pm); --accent-soft:var(--pm-soft); --accent-strong:var(--pm-strong); }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 var(--body);
  padding:env(safe-area-inset-top,0px) 0 calc(78px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.titlerow h1{font-size:28px;font-weight:700}
.titlerow .date{color:var(--muted);font-size:15px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{border:0;background:transparent;border-radius:10px;padding:6px 0 7px;display:grid;justify-items:center;gap:3px;font-size:13px;color:var(--muted)}
.days button b{font-family:var(--display);font-size:16px;color:var(--fg)}
.days button[aria-pressed="true"]{background:var(--accent-soft)}
.days button[aria-pressed="true"] b{color:var(--accent)}
.days .dots{display:flex;gap:3px;height:6px}
.days .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.days .dots i.full{background:var(--ok)}
.days .today-mark{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;height:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].am{background:var(--am-soft);color:var(--am)}
.seg button[aria-pressed="true"].pm{background:var(--pm-soft);color:var(--pm)}

main .wrap{padding-block:18px 24px;display:grid;gap:18px}

/* session intro */
.intro{display:grid;gap:8px}
.intro h2{font-size:26px}
.intro p{margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.startbtn{border:0;background:var(--accent);color:var(--bg);font-weight:700;font-size:18px;padding:14px 18px;border-radius:var(--r);display:flex;justify-content:center;align-items:center;gap:10px}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* legs tracker */
.legs{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.legs .t{min-width:0}
.legs .t b{display:block;font-size:15px}
.legs .t span{font-size:13px;color:var(--muted)}
.legs .slots{display:flex;gap:6px}
.legs .slots button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--muted);min-width:46px}
.legs .slots button[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* steps */
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;position:relative}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;background:var(--surface);border:1.5px solid var(--line);margin-top:14px;position:relative;z-index:1}
.step.done .num{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.step:not(:last-child)::before{content:"";position:absolute;left:16px;top:46px;bottom:-14px;width:1.5px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0;margin-bottom:10px}
.step.yours .card{background:transparent;border-style:dashed}
.card .head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card .head > div{min-width:0}
.card h3{font-size:19px;font-weight:700}
.card .by{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.card .why{margin:0;font-size:16px}
.card ul.cues{margin:0;padding-left:20px;display:grid;gap:4px;font-size:15.5px}
.card .note{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.card .yourlabel{font-size:13px;color:var(--muted);font-style:italic}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:transparent;border-radius:11px;padding:8px 12px;font-weight:700;font-size:15px;text-decoration:none;color:var(--fg);display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.done[aria-pressed="true"]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.check{flex:none;width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.check svg{width:18px;height:18px}
.pause{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-2px 0 12px 48px}
.pause::before{content:"";width:14px;height:1.5px;background:var(--line)}

/* routine cards */
.card .ttl{display:flex;gap:12px;align-items:center;min-width:0}
canvas.cover{flex:none;width:64px;height:52px;border-radius:10px;background:var(--bg)}
.credit{font-size:13px;color:var(--muted);line-height:1.45}
.credit a{white-space:nowrap}
details.movelist summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--accent);list-style:none}
details.movelist summary::-webkit-details-marker{display:none}
details.movelist summary::before{content:"▸ ";}
details.movelist[open] summary::before{content:"▾ ";}
details.movelist ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
details.movelist li{display:flex;gap:10px;align-items:center;min-width:0}
details.movelist li canvas{flex:none;width:72px;height:54px;border-radius:8px;background:var(--bg)}
details.movelist li div{min-width:0;display:grid}
details.movelist li b{font-size:15px}
details.movelist li span{font-size:13px;color:var(--muted)}
ul.facts{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15.5px}
.lede{margin:0;color:var(--muted)}
.muted{margin:0;color:var(--muted)}

/* embedded reel */
.player{display:grid;justify-items:center;gap:6px}
.player iframe{width:100%;max-width:400px;border:0;border-radius:12px;background:var(--bg)}
.player iframe.ig{aspect-ratio:10/19}
.player iframe.fb{aspect-ratio:9/16;max-height:72vh}
.player small{color:var(--muted);font-size:12.5px;text-align:center}

/* animated player */
.pl{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.plstage{position:relative;border-radius:12px;background:var(--bg);overflow:hidden}
.plstage canvas{display:block;width:100%;aspect-ratio:4/3;max-height:46vh}
.pl.going .plstage{box-shadow:inset 0 0 0 2px var(--accent-strong)}
.plside{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.plinfo{display:grid;gap:6px;min-width:0}
.plname{font-size:22px}
.pltime{display:flex;align-items:baseline;gap:12px}
.pltime .big{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.plstate{font-weight:700;color:var(--accent)}
.plcue{margin:0;font-size:16.5px}
.plnext{font-size:14px;color:var(--muted)}
.plctl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px}
.plctl .btn{justify-content:center;min-width:48px;font-size:18px}
.plctl .startbtn{font-size:17px;padding:12px}

/* week */
.week{display:grid;gap:10px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;text-align:left;width:100%}
.wday.is-today{border-color:var(--accent-strong)}
.wday .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wday .wh h3{font-size:18px}
.wday .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wday .cols > div{min-width:0}
.wday .cols b{font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.wday .cols .a b{color:var(--am)} .wday .cols .p b{color:var(--pm)}
.wday .cols ul{margin:4px 0 0;padding-left:16px;font-size:14px;color:var(--muted);display:grid;gap:2px}

/* library + guide */
.lib h2,.guide h2{font-size:21px;margin-bottom:8px}
.libgrp{display:grid;gap:10px}
.libitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.libitem .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.libitem h3{font-size:17px}
.libitem .sched{font-size:13px;color:var(--muted)}
.guide{display:grid;gap:14px}
.guide section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.guide p,.guide li{font-size:16px;margin:0}
.guide ul,.guide ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:6px}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* guided overlay */
.guided{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.guided .gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.guided .gbody{overflow-y:auto;-webkit-overflow-scrolling:touch}
.guided .gbody .wrap{padding-block:16px;display:grid;gap:12px}
.guided .gbody h2{font-size:26px}
.guided .gfoot{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.guided .gfoot .startbtn{font-size:17px;padding:12px}
.closebtn{border:0;background:transparent;font-weight:700;color:var(--muted);padding:6px}
.rest{display:grid;justify-items:center;gap:14px;text-align:center;padding-block:28px}
.ring{width:190px;height:190px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .big{font-family:var(--display);font-size:52px;font-weight:700;font-variant-numeric:tabular-nums}
.breath{font-size:20px;font-weight:700;color:var(--accent);min-height:30px}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .big{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="titlerow"><h1 id="dayTitle">Today</h1><span class="date" id="dateLabel"></span></div>
    <div class="days" id="days" role="group" aria-label="Day of week"></div>
    <div class="seg" role="group" aria-label="Session">
      <button class="am" id="segAm" aria-pressed="true">☀ Morning</button>
      <button class="pm" id="segPm" aria-pressed="false">☾ Evening</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="view"></div>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
    <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>Routines</button>
    <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Guide</button>
  </div>
</nav>

<div class="guided" id="guided" hidden></div>
<div class="guided" id="modal" hidden></div>

<script src="figure.js"></script>
<script src="routines.js"></script>
<script src="app.js"></script>
</body>
</html>
